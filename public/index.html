<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Task Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 40px 20px;
      color: #243047;
    }
    main {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }
    h1 { color: #2457a7; }
    li { margin: 12px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Employee Task Management</h1>
    <p>Welcome! This application helps organize and manage employee tasks.</p>
    <h2>Available Features</h2>
    <ul>
      <li>View all employee tasks</li>
      <li>Add new tasks</li>
      <li>Track task status and priority</li>
      <li>Manage employee responsibilities</li>
    </ul>
    <p>HTTP server home page served using Node.js FS module.</p>
  </main>
</body>
</html>
